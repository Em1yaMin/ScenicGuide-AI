services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    volumes:
      - ./digitalHumanApi:/app
    environment:
      - DEBUG=false
      - DATABASE_URL=sqlite+aiosqlite:///./digital_human.db
      - CORS_ORIGINS=
      - CORS_ALLOW_CREDENTIALS=${CORS_ALLOW_CREDENTIALS:-true}
      - ADMIN_TOKENS=${ADMIN_TOKENS:-}
      - AUTH_RATE_LIMIT_ENABLED=${AUTH_RATE_LIMIT_ENABLED:-true}
      - AUTH_RATE_LIMIT_MAX_FAILURES=${AUTH_RATE_LIMIT_MAX_FAILURES:-5}
      - AUTH_RATE_LIMIT_COOLDOWN_SECONDS=${AUTH_RATE_LIMIT_COOLDOWN_SECONDS:-900}
      - DIFY_API_URL=${DIFY_API_URL:-}
      - DIFY_API_KEY=${DIFY_API_KEY:-}
      - LLM_API_BASE=${LLM_API_BASE:-}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-}
      - LLM_FALLBACK_API_BASE=${LLM_FALLBACK_API_BASE:-}
      - LLM_FALLBACK_API_KEY=${LLM_FALLBACK_API_KEY:-}
      - LLM_FALLBACK_MODEL=${LLM_FALLBACK_MODEL:-}
      - LLM_TEMPERATURE=${LLM_TEMPERATURE:-0.7}
      - JWT_SECRET=${JWT_SECRET:-}
      - JWT_EXPIRES_MINUTES=${JWT_EXPIRES_MINUTES:-1440}
      - GUEST_TOKEN_EXPIRES_MINUTES=${GUEST_TOKEN_EXPIRES_MINUTES:-30}
      - AMAP_WEB_KEY=${AMAP_WEB_KEY:-}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 3

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "80:80"
    depends_on:
      api:
        condition: service_healthy
