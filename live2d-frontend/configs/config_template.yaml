COMMON:
  NAME: "Awesome-Digital-Human"
  VERSION: "v0.0.1"
  LOG_LEVEL: "DEBUG"
SERVER:
  IP: "0.0.0.0"
  PORT: 8001
  ENGINES:
    ASR: 
      SUPPORT_LIST: [ "tencentAPI.yaml" ]
      DEFAULT: "tencentAPI.yaml"
