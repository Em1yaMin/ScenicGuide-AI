      SUPPORT_LIST: [ "qwenTTS.yaml", "minimaxTTS.yaml" ]
      DEFAULT: "qwenTTS.yaml"
  AGENTS: 
    SUPPORT_LIST: [ "langchainAgent.yaml", "difyAgent.yaml" ]
    DEFAULT: "langchainAgent.yaml"