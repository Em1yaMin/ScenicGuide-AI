name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    name: Backend tests (Python 3.12)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digitalHumanApi
    env:
      # app/core/config.py 的 Settings 在导入时校验 Dify 配置非空（无 .env 会抛错）。
      # 测试本身不调用真实 Dify/OpenAI API（纯函数 + 内存 SQLite + 内联 stub），
      # 因此 CI 只注入占位值，不依赖任何密钥。
      # 阶段4：Dify Workflow 量化评估已本地化，DIFY_WORKFLOW_API_KEY 不再需要。
      DIFY_API_URL: https://dify.dummy.invalid/v1
      DIFY_API_KEY: ci-dummy-key
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: digitalHumanApi/requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Run tests with coverage gate
        # 测试使用内存 SQLite（tests/conftest.py 的 sqlite+aiosqlite:///:memory: fixture），
        # 无需 DATABASE_URL / .env。
        # 覆盖率门禁（批次7 C6）：阈值 75% 基于当前基线实测（84%）留余量设定，
        # 避免门禁一开始就红；低于阈值 CI 直接失败。
        run: pytest -q --cov=app --cov-report=term:skip-covered --cov-fail-under=75

  frontend:
    name: Frontend build (Node 22)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digitalHumanVue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digitalHumanVue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint (ESLint + oxlint)
        # C8 前端工程化：存量代码 lint 全绿（ESLint 无 error）。lint 脚本带 --fix
        # 自动修复可修复项；无法修复的 error 以非零退出码使 CI 失败，warning 不阻断。
        run: npm run lint

      - name: Build (vue-tsc type-check + vite build)
        run: npm run build

  e2e:
    name: Frontend E2E smoke (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: digitalHumanVue
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: digitalHumanVue/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright chromium
        # 仅安装 chromium（冒烟套件唯一浏览器），--with-deps 补齐系统依赖
        run: npx playwright install --with-deps chromium

      - name: Run E2E smoke tests
        # 冒烟套件（批次7 C6）：首页/对话页/管理端核心路径，后端接口在浏览器层
        # mock（e2e/mocks.ts），无需真实后端；webServer 自动拉起 vite dev server。
        run: npm run e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: digitalHumanVue/test-results
          retention-days: 7
          if-no-files-found: ignore
