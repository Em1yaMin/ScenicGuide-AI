# Alembic 迁移配置（数据库 schema 版本管理，详见 doc/alembic-migrations.md）
#
# 命令入口（在 digitalHumanApi/ 目录下执行）：
#   alembic upgrade head                        # 升级到最新 schema
#   alembic revision --autogenerate -m "描述"    # 按模型变更生成新迁移（先 review 再提交）
#   alembic current / alembic history            # 查看当前版本/迁移历史
#   alembic -x db_url="sqlite+aiosqlite:////tmp/x.db" revision --autogenerate -m "..."  # 指定临时库生成

[alembic]
# 迁移脚本目录（env.py 位于其下，versions/ 存放版本文件）；
# %(here)s 为 ini 所在目录绝对路径，避免相对 CWD 解析导致从其他目录启动失败
script_location = %(here)s/migrations

# sqlalchemy.url 留空：env.py 按优先级解析——
#   alembic -x db_url=...  > 本选项  > 应用配置 settings.DATABASE_URL（.env / 环境变量，默认 sqlite+aiosqlite:///./digital_human.db）
# 测试可通过 Config.set_main_option("sqlalchemy.url", ...) 程序化覆盖
sqlalchemy.url =

# env.py 中已显式将 digitalHumanApi/ 加入 sys.path，此处兜底（CLI 场景）
prepend_sys_path = %(here)s
path_separator = os

# 日志配置
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
